<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript and DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to the DOM Playground!</h1>
        <p class="greeting">The initial greeting will change dynamically.</p>
    </header>

    <main>
        <section id="style-section">
            <h2>Playing with Styles</h2>
            <p style="color: blue;">This text has an initial style.</p>
            <button id="style-button">Change Text Color</button>
        </section>

        <section id="element-section">
            <h2>Adding and Removing Elements</h2>
            <ul id="item-list">
                <li>Initial Item 1</li>
                <li>Initial Item 2</li>
            </ul>
            <button id="add-button">Add New Item</button>
            <button id="remove-button">Remove Last Item</button>
            <div id="new-element-container">
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 My DOM Manipulation Practice</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
